<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Community Feedback Survey</title>
  <style>
    /* Reset and Base Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #f8fafc;
      color: #334155;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 40px 20px;
    }

    /* Container Styling */
    #survey-container {
      background-color: #ffffff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      width: 100%;
      max-width: 650px;
    }

    /* Typography */
    h1 {
      text-align: center;
      color: #0f172a;
      font-size: 1.8rem;
      margin-bottom: 8px;
    }

    p#description {
      text-align: center;
      color: #64748b;
      margin-bottom: 30px;
      font-size: 0.95rem;
    }

    /* Form Elements */
    form {
      display: flex;
      flex-direction: column;
    }

    label {
      margin-bottom: 6px;
      font-weight: 600;
      color: #475569;
      font-size: 0.95rem;
    }

    input[type="text"],
    input[type="email"],
    input[type="number"],
    select,
    textarea {
      width: 100%;
      padding: 12px;
      margin-bottom: 20px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 1rem;
      font-family: inherit;
      color: #334155;
      background-color: #f8fafc;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input[type="text"]:focus,
    input[type="email"]:focus,
    input[type="number"]:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
      background-color: #ffffff;
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    /* Fieldset for Radio & Checkbox Groups (Improves Accessibility) */
    fieldset {
      border: none;
      margin-bottom: 20px;
    }

    legend {
      font-weight: 600;
      color: #475569;
      margin-bottom: 10px;
      font-size: 0.95rem;
    }

    .radio-group label,
    .checkbox-group label {
      font-weight: normal;
      color: #334155;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      margin-bottom: 8px;
    }

    input[type="radio"],
    input[type="checkbox"] {
      margin-right: 8px;
      cursor: pointer;
      width: 16px;
      height: 16px;
      accent-color: #3b82f6;
    }

    /* Submit Button */
    button {
      background-color: #2563eb;
      color: #ffffff;
      padding: 14px 24px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      width: 100%;
      max-width: 200px;
      align-self: center;
      transition: background-color 0.2s ease, transform 0.1s ease;
      margin-top: 10px;
    }

    button:hover {
      background-color: #1d4ed8;
    }

    button:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <div id="survey-container">
    <h1 id="title">Community Feedback Survey</h1>
    <p id="description">Thank you for taking the time to help us improve our community services.</p>

    <form id="survey-form">
      <!-- Text Inputs -->
      <label id="name-label" for="name">Name:</label>
      <input type="text" id="name" placeholder="Enter your full name" required>

      <label id="email-label" for="email">Email:</label>
      <input type="email" id="email" placeholder="Enter your email address" required>

      <label id="number-label" for="number">Age (optional):</label>
      <input type="number" id="number" placeholder="Enter your age" min="10" max="120">

      <!-- Dropdown -->
      <label for="dropdown">Which option best describes your current role?</label>
      <select id="dropdown" required>
        <option value="" disabled selected>Select current role</option>
        <option value="student">Student</option>
        <option value="full-time-job">Full Time Job</option>
        <option value="part-time-job">Part Time Job</option>
        <option value="unemployed">Unemployed</option>
        <option value="other">Other</option>
      </select>

      <!-- Radio Buttons inside Fieldset -->
      <fieldset class="radio-group">
        <legend>Would you recommend our community services to a friend?</legend>
        <label>
          <input type="radio" id="definitely" name="recommend" value="definitely" checked> Definitely
        </label><br>
        <label>
          <input type="radio" id="maybe" name="recommend" value="maybe"> Maybe
        </label><br>
        <label>
          <input type="radio" id="not-sure" name="recommend" value="not-sure"> Not sure
        </label>
      </fieldset>

      <!-- Checkboxes inside Fieldset -->
      <fieldset class="checkbox-group">
        <legend>What would you like to see improved? (Check all that apply)</legend>
        <label>
          <input type="checkbox" id="events" name="improvement" value="events"> Community Events
        </label><br>
        <label>
          <input type="checkbox" id="facilities" name="improvement" value="facilities"> Public Facilities
        </label><br>
        <label>
          <input type="checkbox" id="communication" name="improvement" value="communication"> Communication
        </label><br>
        <label>
          <input type="checkbox" id="support" name="improvement" value="support"> Local Support Programs
        </label>
      </fieldset>

      <!-- Textarea -->
      <label for="comments">Any additional comments or suggestions?</label>
      <textarea id="comments" placeholder="Enter your comments here..."></textarea>

      <!-- Submit Button -->
      <button type="submit" id="submit">Submit Feedback</button>
    </form>
  </div>

</body>
</html>
